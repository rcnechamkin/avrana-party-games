<!doctype html>
<html lang="en">
<head>
<script src="/shared/avrana-integration.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3417">
<title>BLUFF</title>
<link rel="stylesheet" href="table.css">
</head>
<body>
<div data-avrana-viewport id="app">
  <div id="felt"><div id="felt-mark" data-art="cards_fan" aria-hidden="true"></div></div>

  <button data-avrana-global id="home" class="round-btn" aria-label="Back to games"><span data-icon="house"></span></button>
  <button id="history" class="round-btn" aria-label="What happened"><span data-icon="scroll-text"></span></button>
  <div id="timer" class="corner-box red" hidden></div>

  <div id="opponents"></div>

  <div id="piles">
    <div class="pile"><div class="back mini"></div><div class="back mini"></div><div class="back mini"></div><span id="deck-n"></span></div>
  </div>

  <div id="center">
    <div id="play"></div>
    <div id="caption"></div>
  </div>

  <div id="me-seat"></div>
  <div id="coins" class="corner-box blue" hidden></div>
  <div id="hand"></div>
  <div id="lost"></div>

  <div id="sheet" hidden></div>
  <div id="bar"></div>

  <aside id="drawer" hidden aria-labelledby="drawer-title">
    <div class="drawer-head"><h2 id="drawer-title">What happened</h2><button id="drawer-close" class="round-btn small" aria-label="Close"><span data-icon="x"></span></button></div>
    <ol id="log"></ol>
    <h3 class="drawer-sub">Roles</h3>
    <div id="rolehelp"></div>
  </aside>

  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="dlg-actions">
        <button value="no" class="act" autofocus>Keep playing</button>
        <button value="yes" id="confirm-yes" class="act danger"></button>
      </div>
    </form>
  </dialog>
</div>
<canvas id="confetti"></canvas>
<script src="/shared/hubnet.js?v=avrana1"></script>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="client.js"></script>
</body>
</html>

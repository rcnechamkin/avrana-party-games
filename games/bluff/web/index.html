<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3417">
<title>BLUFF</title>
<link rel="stylesheet" href="table.css">
</head>
<body>
<div id="app">
  <div id="felt"><div id="felt-mark">🎭</div></div>

  <button id="home" class="round-btn" aria-label="Back to games">⌂</button>
  <button id="history" class="round-btn" aria-label="What happened">☰</button>
  <div id="timer" class="corner-box red" hidden></div>

  <div id="opponents"></div>

  <div id="piles">
    <div class="pile"><div class="back mini"></div><div class="back mini"></div><div class="back mini"></div><span id="deck-n"></span></div>
  </div>

  <div id="center">
    <div id="play"></div>
    <div id="caption"></div>
  </div>

  <div id="me-seat"></div>
  <div id="coins" class="corner-box blue" hidden></div>
  <div id="hand"></div>
  <div id="lost"></div>

  <div id="sheet" hidden></div>
  <div id="bar"></div>

  <aside id="drawer" hidden>
    <div class="drawer-head"><b>What happened</b><button id="drawer-close" class="round-btn small">✕</button></div>
    <ol id="log"></ol>
    <div id="rolehelp"></div>
  </aside>
</div>
<canvas id="confetti"></canvas>
<script src="/shared/hubnet.js"></script>
<script src="client.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<script src="/shared/avrana-integration.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DODGEBALL — GAMEHUB</title>
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23070b14"/><text x="32" y="46" font-size="34" text-anchor="middle">🏐</text></svg>'>
<link rel="stylesheet" href="/shared/shared.css">
<link rel="stylesheet" href="dodgeball.css">
</head>
<body>
<div class="bg-fx" aria-hidden="true"></div>

<!-- ============ JOIN ============ -->
<section data-avrana-screen id="scr-join" class="scr" hidden>
  <div class="join-wrap">
    <h1 class="wordmark"><span class="wm-a">DODGE</span><span class="wm-b">BALL</span></h1>
    <p class="tagline">RUN. THROW. DODGE. LAST ONE STANDING.</p>
    <div class="join-card">
      <label class="field-label" for="name-input">CALL SIGN</label>
      <input data-avrana-profile-name id="name-input" maxlength="14" autocomplete="off" spellcheck="false" placeholder="your name">
      <label class="field-label">AVATAR</label>
      <div data-avrana-global id="avatar-grid" class="avatar-grid"></div>
      <button data-avrana-global id="pfp-btn" class="pfp-btn" type="button">📷 OR USE A PHOTO</button>
      <button id="join-btn" class="btn btn-primary btn-big">STEP ON THE COURT</button>
    </div>
  </div>
</section>

<!-- ============ LOBBY ============ -->
<section data-avrana-screen id="scr-lobby" class="scr" hidden>
  <header class="topbar">
    <a data-avrana-return href="/" class="icon-btn" title="hub" style="display:grid;place-items:center">🕹</a>
    <span class="wordmark-sm"><span class="wm-a">DODGE</span><span class="wm-b">BALL</span></span>
    <span style="display:flex;gap:8px">
      <button data-avrana-global id="pfp-btn2" class="icon-btn" title="your photo">📷</button>
      <button id="mute-btn" class="icon-btn">🔊</button>
    </span>
  </header>
  <div class="lobby-body">
    <div class="lobby-sec">
      <div class="sec-head"><h2>ON THE COURT</h2><span id="ready-count" class="sec-badge"></span></div>
      <div id="player-grid" class="player-grid"></div>
      <p class="seat-note" id="seat-note"></p>
    </div>
    <div class="lobby-sec">
      <div class="sec-head"><h2>MATCH RULES</h2></div>
      <div class="opt-row"><span class="field-label">COURT</span><div id="opt-players" class="seg"></div></div>
      <div class="opt-row"><span class="field-label">MODE</span><div id="opt-mode" class="seg"></div></div>
      <div class="opt-row"><span class="field-label">LIVES</span><div id="opt-lives" class="seg"></div></div>
      <div class="opt-row"><span class="field-label">BOTS</span><div id="opt-diff" class="seg"></div></div>
      <div class="opt-row"><span class="field-label">BALLS</span>
        <div class="stepper">
          <button id="balls-minus" class="step-btn">−</button>
          <span id="balls-val" class="step-val">4</span>
          <button id="balls-plus" class="step-btn">+</button>
        </div></div>
      <div class="opt-row"><span class="field-label">AIM ASSIST</span>
        <button id="assist-btn" class="btn assist-toggle">OFF</button></div>
      <p class="rules-note">Left thumb runs · right thumb drags to aim &amp; throw (tap = quick throw / catch) · DASH to dodge.</p>
    </div>
  </div>
  <footer class="lobby-foot">
    <button id="ready-btn" class="btn btn-ready btn-big">READY UP</button>
    <button id="go-btn" class="btn btn-go btn-big" hidden>START MATCH</button>
    <p id="lobby-hint" class="lobby-hint">waiting for players…</p>
  </footer>
</section>

<!-- ============ GAME ============ -->
<section data-avrana-screen id="scr-game" class="scr" hidden>
  <canvas id="cv"></canvas>
  <div id="rotate-hint" class="rotate-hint" hidden>↻ turn your phone sideways</div>
</section>

<!-- game over -->
<div id="gameover" class="modal" hidden>
  <div class="modal-card go-card">
    <p class="go-crown">🏆</p>
    <p id="go-title" class="go-title">WINNER</p>
    <p id="go-line" class="go-line"></p>
    <button id="rematch-btn" class="btn btn-primary btn-big">BACK TO LOBBY</button>
    <p id="go-auto" class="lobby-hint"></p>
  </div>
</div>

<div id="countdown-overlay" class="countdown-overlay" hidden><span id="countdown-num">3</span></div>
<canvas id="confetti"></canvas>

<script src="/shared/hubnet.js?v=avrana1"></script>
<script src="/shared/brag.js"></script>
<script src="dodgeball.js"></script>
</body>
</html>

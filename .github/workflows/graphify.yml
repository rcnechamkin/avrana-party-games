name: Graphify derived context
on:
  push:
    branches: [main, chore/graphify-derived-context]
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  derived-context:
    uses: rcnechamkin/avrana-party/.github/workflows/graphify-refresh.yml@9cbce3a0ba95664bbd4152025a4b7d62a55947a6
    with:
      toolkit_ref: '9cbce3a0ba95664bbd4152025a4b7d62a55947a6'
      require_linear: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/chore/graphify-derived-context' }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

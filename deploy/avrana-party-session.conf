# systemd drop-in for the games service: Avrana party sessions (core/party_session.py).
#   sudo install -D -m 0644 deploy/avrana-party-session.conf #        /etc/systemd/system/avranaparty-games.service.d/avrana-party-session.conf
#   sudo systemctl daemon-reload && sudo systemctl restart avranaparty-games
# Both values or neither: with a key but no usable party URL the server keeps party sessions off.
#   AVRANA_PARTY_KEYS  directory of <slug>.key files (32-byte hex, 0600, the same key the party
#                      service holds for that game; only BLUFF looks for one today)
#   AVRANA_PARTY_URL   the Party Core service on loopback, where `ended` reports go
# PROPOSED values, to be confirmed by the Party Core deployment (AVR-51): port 8191 keeps clear of
# the Pi's dev front door on 8190. Rollback: remove this file, daemon-reload, restart.
[Service]
Environment=AVRANA_PARTY_KEYS=/etc/avrana-party/game-keys
Environment=AVRANA_PARTY_URL=http://127.0.0.1:8191

# systemd drop-in for the games service: Avrana party sessions (core/party_session.py).
# Installed with deploy/avranaparty-games.service by avrana-party's ops/migrate-service-users.sh
# (ADR 0016 phase 1, AVR-256) as
#   /etc/systemd/system/avranaparty-games.service.d/avrana-party-session.conf
# Both halves or neither: with a key but no usable party URL the server keeps party sessions off.
#   LoadCredential     systemd reads each key as root when the unit starts and hands this unit a
#                      private copy. The service has no access to the key directory, which belongs
#                      to Party Core, and receives only the keys of the Party games it hosts:
#                      core/party_session.py GAMES. EVERY file named here must exist or the unit
#                      does not start: provision a key for each game first
#                      (avrana-party ops/provision-party-game-key.sh <slug>).
#                      Needs the key loader that accepts a credential file (AVR-253).
#   AVRANA_PARTY_KEYS  %d, this unit's credentials directory: a directory of <slug>.key files,
#                      which is what core/party_session.py load_sides reads
#   AVRANA_PARTY_URL   the Party Core service on loopback, where `ended` reports go
# Before the migration the same two variables pointed the service at the shared key directory by
# path; that form is in this file's history. Rollback is the migration's --reverse.
[Service]
LoadCredential=bluff.key:/etc/avrana-party/game-keys/bluff.key
LoadCredential=expo.key:/etc/avrana-party/game-keys/expo.key
Environment=AVRANA_PARTY_KEYS=%d
Environment=AVRANA_PARTY_URL=http://127.0.0.1:8191
# Optional (AVR-222, avrana-party ADR 0014). Leave unset until the owner retires standalone play:
#   AVRANA_STANDALONE_ADMISSION=0   a hello without a Party ticket may only watch, in every room.
#                                   Today that leaves BLUFF as the only playable title, because
#                                   the donor titles have no Party session.
#   LANGAMES_HOST                   NOT here. The unit sets 127.0.0.1: on the appliance the listener is
#                                   an upstream of nginx only (AVR-272); a test refuses it in a drop-in.
#   AVRANA_PARTY_ORIGIN=https://party.avrana.net
#                                   game pages are served from another origin than the Party
#                                   (avrana-party ADR 0013, AVR-226): they reach the Party only
#                                   through its bridge frame. Set it only together with the game
#                                   host name's certificate, DNS record and nginx server block,
#                                   and Party Core's game_origins. Unset, nothing changes.
